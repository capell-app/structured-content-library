<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Theme rendering reusable content</title>
  <desc id="desc">A public theme page rendering testimonials, case studies, and FAQs from structured content records.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf8; }
      .ink { fill: #111827; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #667085; font-family: Inter, Arial, sans-serif; font-size: 21px; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 52px; font-weight: 800; }
      .label { fill: #111827; font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 800; }
      .small { fill: #667085; font-family: Inter, Arial, sans-serif; font-size: 18px; }
      .panel { fill: #fff; stroke: #ddd8cd; stroke-width: 1; }
      .green { fill: #226f68; }
      .line { stroke: #e5e0d6; stroke-width: 2; }
      .chip { fill: #e7f6f3; stroke: #a7d8ce; stroke-width: 1; }
      .chipText { fill: #17655f; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text x="96" y="74" class="ink" font-size="28" font-weight="800">Northstar Studio</text>
  <text x="982" y="74" class="muted">Services</text>
  <text x="1094" y="74" class="muted">Work</text>
  <text x="1182" y="74" class="muted">FAQ</text>
  <rect x="1260" y="42" width="112" height="46" rx="23" class="green"/>
  <text x="1288" y="73" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Contact</text>

  <text x="96" y="176" class="title">Reusable content, rendered by theme sections</text>
  <text x="96" y="220" class="muted">Testimonials, case studies, services, and FAQs come from typed records instead of page markup.</text>

  <rect x="96" y="286" width="390" height="234" rx="8" class="panel"/>
  <rect x="126" y="316" width="132" height="34" rx="17" class="chip"/>
  <text x="152" y="338" class="chipText">Testimonial</text>
  <text x="126" y="392" class="label">"The launch was calmer."</text>
  <text x="126" y="460" class="small">Sarah Patel, Operations Director</text>

  <rect x="526" y="286" width="390" height="234" rx="8" class="panel"/>
  <rect x="556" y="316" width="128" height="34" rx="17" class="chip"/>
  <text x="582" y="338" class="chipText">Case study</text>
  <text x="556" y="392" class="label">Acme redesign win</text>
  <text x="556" y="430" class="small">Reusable proof rendered across themes.</text>
  <line x1="556" y1="470" x2="846" y2="470" class="line"/>
  <text x="556" y="500" class="small">Published content record</text>

  <rect x="956" y="286" width="390" height="234" rx="8" class="panel"/>
  <rect x="986" y="316" width="88" height="34" rx="17" class="chip"/>
  <text x="1012" y="338" class="chipText">FAQ</text>
  <text x="986" y="392" class="label">How are fields kept portable?</text>
  <text x="986" y="430" class="small">Semantic HTML and scalar payloads only.</text>

  <rect x="96" y="586" width="1250" height="170" rx="8" class="panel"/>
  <text x="136" y="642" class="label">Theme-safe adapter payload</text>
  <text x="136" y="685" class="muted">Model IDs, admin fields, authoring markers, package internals, and unsafe URLs are omitted before rendering.</text>
  <rect x="136" y="714" width="210" height="36" rx="18" class="chip"/>
  <text x="166" y="738" class="chipText">Plain text payloads</text>
  <rect x="374" y="714" width="232" height="36" rx="18" class="chip"/>
  <text x="404" y="738" class="chipText">Portable summary HTML</text>
  <rect x="634" y="714" width="180" height="36" rx="18" class="chip"/>
  <text x="664" y="738" class="chipText">HTTP(S) links</text>
</svg>
