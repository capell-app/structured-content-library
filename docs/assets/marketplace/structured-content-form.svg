<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Structured content create form</title>
  <desc id="desc">Capell admin form for creating a reusable structured content record with portable content and typed payload fields.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .sidebar { fill: #172033; }
      .panel { fill: #fff; stroke: #d9e0ea; stroke-width: 1; }
      .field { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .title { fill: #0f172a; font-family: Inter, Arial, sans-serif; font-size: 44px; font-weight: 800; }
      .label { fill: #111827; font-family: Inter, Arial, sans-serif; font-size: 23px; font-weight: 700; }
      .small { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 19px; }
      .tiny { fill: #64748b; font-family: Inter, Arial, sans-serif; font-size: 17px; }
      .white { fill: #f8fafc; font-family: Inter, Arial, sans-serif; }
      .nav { fill: #a7b4c7; font-family: Inter, Arial, sans-serif; font-size: 22px; }
      .activeNav { fill: #fff; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .accent { fill: #226f68; }
      .line { stroke: #e2e8f0; stroke-width: 2; }
      .chip { fill: #e7f6f3; stroke: #a7d8ce; stroke-width: 1; }
      .chipText { fill: #17655f; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="sidebar" width="270" height="900"/>
  <text x="42" y="72" class="white" font-size="30" font-weight="800">Capell Admin</text>
  <rect x="28" y="216" width="214" height="54" rx="8" fill="#25314a"/>
  <text x="56" y="251" class="activeNav">Structured content</text>
  <text x="56" y="313" class="nav">Pages</text>
  <text x="56" y="375" class="nav">Themes</text>
  <text x="56" y="437" class="nav">Extensions</text>

  <text x="330" y="88" class="title">Create structured content</text>
  <text x="332" y="128" class="small">Store portable records that themes can render without layout markup.</text>
  <rect x="1130" y="54" width="172" height="56" rx="8" class="accent"/>
  <text x="1184" y="90" class="white" font-size="22" font-weight="800">Create</text>

  <rect x="330" y="170" width="1030" height="630" rx="8" class="panel"/>
  <text x="366" y="224" class="label">Record details</text>
  <line x1="366" y1="250" x2="1324" y2="250" class="line"/>
  <text x="366" y="294" class="small">Title</text>
  <rect x="366" y="314" width="446" height="54" rx="8" class="field"/>
  <text x="394" y="349" class="tiny">Customer quote: Sarah Patel</text>
  <text x="850" y="294" class="small">Type</text>
  <rect x="850" y="314" width="210" height="54" rx="8" class="field"/>
  <text x="878" y="349" class="tiny">Testimonial</text>
  <text x="1090" y="294" class="small">Status</text>
  <rect x="1090" y="314" width="190" height="54" rx="8" class="field"/>
  <text x="1118" y="349" class="tiny">Published</text>

  <text x="366" y="424" class="small">Portable summary</text>
  <rect x="366" y="444" width="914" height="74" rx="8" class="field"/>
  <text x="394" y="486" class="tiny">A concise customer proof point used across landing pages and service pages.</text>

  <text x="366" y="572" class="label">Typed payload</text>
  <rect x="366" y="600" width="280" height="52" rx="8" class="field"/>
  <text x="394" y="634" class="tiny">Sarah Patel</text>
  <text x="366" y="682" class="small">Name</text>
  <rect x="684" y="600" width="280" height="52" rx="8" class="field"/>
  <text x="712" y="634" class="tiny">Operations Director</text>
  <text x="684" y="682" class="small">Role</text>
  <rect x="1000" y="600" width="280" height="52" rx="8" class="field"/>
  <text x="1028" y="634" class="tiny">Northstar Studio</text>
  <text x="1000" y="682" class="small">Organization</text>

  <rect x="366" y="718" width="914" height="52" rx="26" class="chip"/>
  <text x="394" y="751" class="chipText">Portable HTML guard active: no classes, inline styles, scripts, IDs, or editor markers</text>
</svg>
