  <text x="620" y="336" class="label">Type</text>
  <text x="806" y="336" class="label">Status</text>
  <text x="994" y="336" class="label">Summary</text>
  <line x1="330" y1="360" x2="1360" y2="360" class="line"/>

  <text x="366" y="416" class="label">Acme redesign win</text>
  <text x="366" y="445" class="tiny">acme-redesign-win</text>
  <rect x="620" y="393" width="126" height="36" rx="18" class="chipBlue"/>
  <text x="646" y="417" class="blueText">Case study</text>
  <rect x="806" y="393" width="124" height="36" rx="18" class="chipGreen"/>
  <text x="832" y="417" class="greenText">Published</text>
  <text x="994" y="416" class="small">Reusable proof for agency pages</text>
  <line x1="330" y1="474" x2="1360" y2="474" class="line"/>

  <text x="366" y="530" class="label">Sarah Patel quote</text>
  <text x="366" y="559" class="tiny">sarah-patel-quote</text>
  <rect x="620" y="507" width="138" height="36" rx="18" class="chipAmber"/>
  <text x="646" y="531" class="amberText">Testimonial</text>
  <rect x="806" y="507" width="124" height="36" rx="18" class="chipGreen"/>
  <text x="832" y="531" class="greenText">Published</text>
  <text x="994" y="530" class="small">Customer quote with role metadata</text>
  <line x1="330" y1="588" x2="1360" y2="588" class="line"/>

  <text x="366" y="644" class="label">Implementation FAQ</text>
  <text x="366" y="673" class="tiny">implementation-faq</text>
  <rect x="620" y="621" width="90" height="36" rx="18" class="chipGreen"/>
  <text x="646" y="645" class="greenText">FAQ</text>
  <rect x="806" y="621" width="92" height="36" rx="18" class="chipAmber"/>
  <text x="832" y="645" class="amberText">Draft</text>
  <text x="994" y="644" class="small">Portable questions for theme sections</text>
  <line x1="330" y1="702" x2="1360" y2="702" class="line"/>

  <text x="366" y="758" class="label">London office</text>
  <text x="366" y="787" class="tiny">london-office</text>
  <rect x="620" y="735" width="116" height="36" rx="18" class="chipBlue"/>
  <text x="646" y="759" class="blueText">Location</text>
  <rect x="806" y="735" width="124" height="36" rx="18" class="chipGreen"/>
  <text x="832" y="759" class="greenText">Published</text>
  <text x="994" y="758" class="small">Address and contact payload</text>
</svg>
